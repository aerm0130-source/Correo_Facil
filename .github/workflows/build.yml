
name: Crear APK Correo Facil

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Descomprimir proyecto
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -q CorreoClaro_GitHub_Autocompila.zip -d proyecto
          test -f proyecto/app/build.gradle
          test -f proyecto/settings.gradle

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Conservar firma
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: correo-facil-debug-signing-v1

      - name: Compilar APK
        working-directory: proyecto
        run: gradle --no-daemon :app:assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CorreoFacil-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
